name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Shared helper — true when a PR touches the given path prefix.
# On push to master every job always runs (no filter needed).
# The [ci-all] title escape hatch forces all jobs on any PR.
#
# Path filtering is computed once, in the `changes` job, via
# dorny/paths-filter — NOT via github.event.pull_request.files, which is
# not a real field in the pull_request webhook payload (the previous
# version of this file used it and every path-gated job silently
# skipped on every regular PR as a result; see #28).

jobs:
  # ── Path filter (computed once, reused by every job below) ──────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      benches: ${{ steps.filter.outputs.benches }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      react_sodp: ${{ steps.filter.outputs.react_sodp }}
      sodp_py: ${{ steps.filter.outputs.sodp_py }}
      sodp_java: ${{ steps.filter.outputs.sodp_java }}
      sodp_go: ${{ steps.filter.outputs.sodp_go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'sodp-middleware/**'
            benches:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'benches/**'
            client_ts:
              - 'client-ts/**'
            react_sodp:
              - 'react-sodp/**'
              - 'client-ts/**'
            sodp_py:
              - 'sodp-py/**'
            sodp_java:
              - 'sodp-java/**'
            sodp_go:
              - 'sodp-go/**'

  # ── Rust server ─────────────────────────────────────────────────────────────
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # ── Rust benchmarks ────────────────────────────────────────────────────────
  benchmark:
    name: Rust benchmarks (criterion)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.title, '[ci-all]') ||
        needs.changes.outputs.benches == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --bench delta --bench codec --bench state -- --output-format bencher | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ── TypeScript client (@sodp/client) ────────────────────────────────────────
  typescript-client:
    name: TypeScript client (build · test)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.client_ts == 'true'
    defaults:
      run:
        working-directory: client-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── React hooks (@sodp/react) ────────────────────────────────────────────────
  typescript-react:
    name: TypeScript React hooks (build)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.react_sodp == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client-ts/package-lock.json
            react-sodp/package-lock.json

      - name: Build @sodp/client
        working-directory: client-ts
        run: npm ci && npm run build

      - name: Build @sodp/react
        working-directory: react-sodp
        run: npm ci && npm run build

  # ── Python client (sodp) ─────────────────────────────────────────────────────
  python:
    name: Python client (install · test)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.sodp_py == 'true'
    defaults:
      run:
        working-directory: sodp-py
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" || pip install -e .
      - name: Test
        run: python -m pytest --tb=short -q || echo "No tests found — skipping"

  # ── Java client (io.sodp:sodp-client) ───────────────────────────────────────
  java:
    name: Java client (test)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.sodp_java == 'true'
    defaults:
      run:
        working-directory: sodp-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --no-transfer-progress test

  # ── Go server (sodp-go) ──────────────────────────────────────────────────────
  go:
    name: Go server (vet · test)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, '[ci-all]') ||
      needs.changes.outputs.sodp_go == 'true'
    defaults:
      run:
        working-directory: sodp-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sodp-go/go.mod
          cache-dependency-path: sodp-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
